<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Cafetería</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="bg-header">
    <div class="bg-navbar">
        <div class="container navbar">
            <a th:href="@{/}" class="navbar-brand">
                <img th:src="@{/imagenes/logo.svg}" alt="Logo"> Cafetería
            </a>
            <nav class="navbar-nav">
                <a th:href="@{/}" class="nav-link">Inicio</a>
                <a th:href="@{/usuario}" class="nav-link">Mi Perfil</a>
                <a th:href="@{/promociones}" class="nav-link">Promociones</a>
                <a th:href="@{/pedidos}" class="nav-link">Pedidos</a>
            </nav>
        </div>
    </div>
</header>

<main class="container page-main">
    <div class="page-card" style="margin: 0 auto; background-color: #fff; color: #333;">
        <div class="header-perfil" style="background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('/imagenes/fondo cafe.jfif') center/cover; color: white; padding: 40px 20px; text-align: center;">
            <img th:src="@{/imagenes/foto.jfif}" alt="Avatar" class="avatar" style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; margin-bottom: 10px;">
            <h1 class="page-title" style="margin:0; color: white;">¡Hola, Coffee Lover! 👋</h1>
            <p style="margin:5px 0 0;">☕ Miembro VIP - Amante del buen café</p>
        </div>
        <div class="seccion" style="padding: 20px; text-align: left;">
            <h2 style="border-bottom: 2px solid #f0e6d2; padding-bottom: 10px; margin-top: 0; color: #3b2416;">Mis Favoritos ❤️</h2>
            <div class="lista-favoritos" style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;">
                <div class="fav-item" style="min-width: 120px; text-align: center;">
                    <img th:src="@{/imagenes/capuchino.jfif}" alt="Capuccino" style="width: 100%; height: 90px; border-radius: 10px; object-fit: cover;">
                    <p style="font-size: 0.9rem; margin-top: 5px; color: #333;">Capuccino</p>
                </div>
                <div class="fav-item" style="min-width: 120px; text-align: center;">
                    <img th:src="@{/imagenes/roscas.jfif}" alt="Postres" style="width: 100%; height: 90px; border-radius: 10px; object-fit: cover;">
                    <p style="font-size: 0.9rem; margin-top: 5px; color: #333;">Postres</p>
                </div>
                <div class="fav-item" style="min-width: 120px; text-align: center;">
                    <img th:src="@{/imagenes/frape.jfif}" alt="Frappé" style="width: 100%; height: 90px; border-radius: 10px; object-fit: cover;">
                    <p style="font-size: 0.9rem; margin-top: 5px; color: #333;">Frappé Moka</p>
                </div>
            </div>
        </div>
        <div class="seccion" style="padding: 20px; text-align: center; border-top: 1px solid #eee;">
            <a th:href="@{/}" class="btn btn-primary">🏠 Volver a la Tienda</a>
            <a th:href="@{/promociones}" class="btn btn-secondary">🎟️ Ver Promos</a>
        </div>
    </div>
</main>
</body>
</html>
