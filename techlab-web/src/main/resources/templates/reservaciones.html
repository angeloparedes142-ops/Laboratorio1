<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservaciones y Contacto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Coffee </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
        <li class="nav-item"><a class="nav-link active" th:href="@{/reservaciones}">Reservaciones</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/usuario}">Usuario</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h1 class="text-center mb-4">Reservaciones y Contacto</h1>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Reserva tu mesa</h3>
          <hr>
          <form id="formReserva" class="row g-3" novalidate>
            <div class="col-md-6">
              <label class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" required minlength="3">
            </div>
            <div class="col-md-6">
              <label class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" required pattern="[0-9+\s-]{7,15}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Hora</label>
              <input type="time" class="form-control" id="hora" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Personas</label>
              <input type="number" class="form-control" id="personas" min="1" max="20" required value="2">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Confirmar reservación</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Visítanos</h3>
          <hr>
          <p><strong>Dirección:</strong> Av. Los Almendros 245, San Isidro, Lima</p>
          <p><strong>Teléfono:</strong> +51 987 654 321</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
