<div class="carrito-container">

    <h1 class="text-center mb-4">🛒 MI CARRITO</h1>

    <div id="carrito"></div>

    <div class="text-end mt-4">

        <p class="total">
            Total: S/ <span id="total">0.00</span>
        </p>

        <button class="btn btn-danger me-2" onclick="vaciarCarrito()">
            Vaciar carrito
        </button>

        <button class="btn btn-success" onclick="realizarPedido()">
            Realizar pedido
        </button>

    </div>

</div>
```

</div>

<script>

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
function mostrarCarrito() {
    const contenedor = document.getElementById("carrito");
    contenedor.innerHTML = "";
    let total = 0;
    if (carrito.length === 0) {
        contenedor.innerHTML = `
            <div class="text-center">
                <h4>🛒 Tu carrito está vacío</h4>
                <p>Agrega productos para realizar un pedido.</p>
            </div>
        `;

    } else {

        carrito.forEach((producto, index) => {
            total += producto.precio * producto.cantidad;
            contenedor.innerHTML += `

                <div class="producto-carrito row align-items-center">
                    <div class="col-md-4">
                        <strong>${producto.nombre}</strong>
                    </div>
                    <div class="col-md-2">
                        S/ ${producto.precio.toFixed(2)}
                    </div>

                    <div class="col-md-3">

                        <button class="btn btn-sm btn-outline-dark"
                            onclick="cambiarCantidad(${index}, -1)">
                            -
                        </button>
                        <span class="mx-2">
                            ${producto.cantidad}
                        </span>
                        <button class="btn btn-sm btn-outline-dark"
                            onclick="cambiarCantidad(${index}, 1)">
                            +
                        </button>

                    </div>

                    <div class="col-md-2">
                        S/ ${(producto.precio * producto.cantidad).toFixed(2)}
                    </div>

                    <div class="col-md-1">

                        <button class="btn btn-sm btn-eliminar"
                            onclick="eliminarProducto(${index})">
                            🗑️
                        </button>
                    </div>
                </div>

            `;

        });

    }


    document.getElementById("total").textContent = total.toFixed(2);
    localStorage.setItem("carrito", JSON.stringify(carrito));

}


function cambiarCantidad(index, cambio) {
    carrito[index].cantidad += cambio;
    if (carrito[index].cantidad <= 0) {
        carrito.splice(index, 1);

    }
    mostrarCarrito();

}


function eliminarProducto(index) {
    carrito.splice(index, 1);
    mostrarCarrito();

}

function vaciarCarrito() {
    carrito = [];
    mostrarCarrito();

}

function realizarPedido() {
    if (carrito.length === 0) {
        alert("Tu carrito está vacío 🛒");
        return;
    }


    alert("¡Pedido realizado con éxito! ☕🎉");
    carrito = [];
    mostrarCarrito();

}


mostrarCarrito();
</script>
</body>
