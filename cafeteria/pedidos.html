<!DOCTYPE html>

<html lang="es">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Carrito | Coffee</title>

<link rel="stylesheet" href="css/styles.css">

<style>

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f1eb;
    }

    header {
        background-color: #5c3a21;
        padding: 20px;
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .contenedor-carrito {
        max-width: 900px;
        margin: 40px auto;
        padding: 25px;
    }

    .titulo-carrito {
        text-align: center;
        color: #5c3a21;
        margin-bottom: 30px;
    }

    .carrito-contenido {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .producto-carrito {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid #ddd;
    }

    .info-producto {
        flex: 1;
    }

    .info-producto h3 {
        margin: 0 0 10px 0;
        color: #5c3a21;
    }

    .controles-cantidad {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .controles-cantidad button {
        background-color: #5c3a21;
        color: white;
        border: none;
        border-radius: 5px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        font-size: 18px;
    }

    .subtotal-producto {
        text-align: right;
    }

    .btn-eliminar {
        display: block;
        margin-top: 10px;
        padding: 8px 12px;
        background-color: #c0392b;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .carrito-vacio {
        text-align: center;
        padding: 50px 20px;
    }

    .resumen {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 2px solid #5c3a21;
        text-align: right;
    }

    .total {
        font-size: 24px;
        color: #5c3a21;
    }

    .botones {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        flex-wrap: wrap;
    }

    .btn-vaciar,
    .btn-pedido {
        padding: 12px 20px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 16px;
    }

    .btn-vaciar {
        background-color: #c0392b;
        color: white;
    }

    .btn-pedido {
        background-color: #5c3a21;
        color: white;
    }

    .seguir-comprando {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 18px;
        background-color: #5c3a21;
        color: white;
        text-decoration: none;
        border-radius: 7px;
    }

    #contador-carrito {
        background-color: #c0392b;
        color: white;
        padding: 3px 8px;
        border-radius: 50%;
    }

    @media (max-width: 650px) {

        .producto-carrito {
            flex-direction: column;
            text-align: center;
        }

        .subtotal-producto {
            text-align: center;
        }

        .resumen {
            text-align: center;
        }

        .botones {
            justify-content: center;
        }

    }

</style>
```

</head>

<body>

<header>

```
<nav>

    <a href="index.html">
        🏠 Inicio
    </a>

    <a href="coffe.html">
        ☕ Café
    </a>

    <a href="postres.html">
        🍰 Postres
    </a>

    <a href="pedidos.html">
        🛒 Carrito
        <span id="contador-carrito">0</span>
    </a>

</nav>
```

</header>

<main class="contenedor-carrito">

```
<h1 class="titulo-carrito">
    🛒 Mi Carrito de Compras
</h1>


<div class="carrito-contenido">


    <div id="lista-carrito">

        <!-- Aquí aparecerán los productos -->

    </div>


    <section class="resumen">


        <h2>
            Resumen del pedido
        </h2>


        <h3 class="total">

            Total:

            <span id="total-carrito">
                S/ 0.00
            </span>

        </h3>


        <div class="botones">


            <button
                class="btn-vaciar"
                onclick="vaciarCarrito()"
            >

                🗑 Vaciar carrito

            </button>


            <button
                class="btn-pedido"
                onclick="realizarPedido()"
            >

                ☕ Realizar pedido

            </button>


        </div>


    </section>


    <a
        href="coffe.html"
        class="seguir-comprando"
    >

        ← Seguir comprando

    </a>


</div>
```

</main>

<script src="carrito.js"></script>

</body>
</html>
